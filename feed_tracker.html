<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-t>Ζωοτροφές — Σιτηρέσια και πρόσθετα ανά κοπάδι</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.min.js"></script>

<style>
:root{--zoom:unset}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:'Inter',system-ui,sans-serif;background:var(--gh-canvas-default);color:var(--gh-fg-default);min-height:100vh;}

/* HEADER */
.header{background:var(--gh-canvas-subtle);border-bottom:1px solid var(--gh-border-default);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:50;}
.header-left{display:flex;align-items:center;gap:10px}
.header-icon{font-size:18px}
.header-title{font-size:15px;font-weight:600;color:var(--gh-fg-default)}
.header-sub{font-size:12px;color:var(--gh-fg-muted);margin-top:1px}
.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0}

/* SYNC BADGE */
.sync-badge{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--gh-border-default);border-radius:var(--rs);font-size:12px;font-weight:500;color:var(--gh-fg-muted);background:var(--gh-canvas-subtle);white-space:nowrap;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--gh-fg-subtle);flex-shrink:0;}
.sync-badge.ok .sync-dot{background:var(--gh-success-fg);}
.sync-badge.ok{color:var(--gh-success-fg);border-color:rgba(79,209,139,0.3);}
.sync-badge.err .sync-dot{background:var(--gh-danger-fg);}
.sync-badge.err{color:var(--gh-danger-fg);border-color:rgba(255,107,107,0.3);}
.sync-badge.loading .sync-dot{background:var(--gh-accent-fg);animation:pulse 1s infinite;}
.sync-badge.loading{color:var(--gh-accent-fg);border-color:rgba(141,180,255,0.3);}
.sync-badge.saving .sync-dot{background:var(--gh-attention-fg);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

/* ZOOM */
.zoom-ctrl{display:flex;align-items:center;gap:4px}
.zoom-btn{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border:1px solid var(--gh-border-default);border-radius:var(--rs);background:var(--gh-canvas-subtle);color:var(--gh-fg-muted);font-size:14px;font-weight:600;cursor:pointer;transition:background 0.15s,color 0.15s;user-select:none;}
.zoom-btn:hover{background:var(--gh-hover-bg);color:var(--gh-fg-default)}
.zoom-label{font-size:12px;color:var(--gh-fg-muted);min-width:36px;text-align:center}

/* THEME */
.theme-toggle{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--gh-border-default);border-radius:var(--rs);background:var(--gh-canvas-subtle);color:var(--gh-fg-muted);font-family:'Inter',system-ui,sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:background 0.15s,border-color 0.15s,color 0.15s;user-select:none;}
.theme-toggle:hover{background:var(--gh-hover-bg);color:var(--gh-fg-default);border-color:var(--gh-fg-subtle)}

/* OFFLINE OVERLAY */
.offline-overlay{display:none;position:fixed;inset:0;background:rgba(10,12,17,0.85);z-index:200;align-items:center;justify-content:center;flex-direction:column;gap:12px;backdrop-filter:blur(3px);}
.offline-overlay.active{display:flex;}
.offline-msg{font-size:15px;font-weight:600;color:var(--gh-danger-fg);text-align:center;line-height:1.6;}
.offline-msg span{display:block;font-size:12px;font-weight:400;color:var(--gh-fg-muted);margin-top:6px;}
.offline-retry{display:flex;align-items:center;gap:6px;height:32px;padding:0 14px;border:1px solid var(--gh-border-default);border-radius:var(--rs);background:var(--gh-canvas-subtle);color:var(--gh-fg-default);font-family:'Inter',system-ui,sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:background 0.15s;}
.offline-retry:hover{background:var(--gh-hover-bg);}

/* MAIN */
.main{padding:16px;transform-origin:top left;}

/* TABLE */
.table-wrap{overflow-x:auto;border:1px solid var(--gh-border-default);border-radius:var(--r);background:var(--gh-canvas-subtle);}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap;}
thead tr{background:var(--gh-canvas-inset);border-bottom:1px solid var(--gh-border-default);}
thead th{padding:8px 10px;font-size:11px;font-weight:600;color:var(--gh-fg-muted);text-align:left;text-transform:uppercase;letter-spacing:0.04em;border-right:1px solid var(--gh-border-muted);}
thead th:last-child{border-right:none}
tbody tr{border-bottom:1px solid var(--gh-border-muted);transition:background 0.1s;}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--gh-hover-bg)}
tbody td{padding:9px 10px;color:var(--gh-fg-default);border-right:1px solid var(--gh-border-muted);vertical-align:middle;}
tbody td:last-child{border-right:none}

/* INPUTS */
.cell-input{background:transparent;border:1px solid transparent;border-radius:4px;color:var(--gh-fg-default);font-family:'Inter',system-ui,sans-serif;font-size:13px;padding:3px 6px;width:100%;transition:border-color 0.15s,background 0.15s;outline:none;}
.cell-input:hover{border-color:var(--gh-border-default);background:var(--gh-canvas-default)}
.cell-input:focus{border-color:var(--gh-accent-emphasis);background:var(--gh-canvas-default);box-shadow:0 0 0 3px rgba(77,141,255,0.3)}
.cell-input:disabled{opacity:0.45;cursor:not-allowed;}
select.cell-input{cursor:pointer;padding-right:4px}
select.cell-input option{background:var(--gh-canvas-subtle);color:var(--gh-fg-default)}
select.cell-input option:disabled{color:var(--gh-fg-subtle);}

/* DATE TEXT INPUT */
.date-text-input{background:transparent;border:1px solid transparent;border-radius:4px;color:var(--gh-fg-default);font-family:'Inter',system-ui,sans-serif;font-size:13px;padding:3px 6px;width:115px;transition:border-color 0.15s,background 0.15s;outline:none;}
.date-text-input:hover{border-color:var(--gh-border-default);background:var(--gh-canvas-default)}
.date-text-input:focus{border-color:var(--gh-accent-emphasis);background:var(--gh-canvas-default);box-shadow:0 0 0 3px rgba(77,141,255,0.3)}
.date-text-input:disabled{opacity:0.45;cursor:not-allowed;}
.date-text-input::placeholder{color:var(--gh-fg-subtle);}
.date-text-input.invalid{border-color:var(--gh-danger-fg) !important;box-shadow:0 0 0 3px var(--gh-danger-subtle) !important;}

/* HOUSE CARDS */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:16px;}
.card{background:var(--gh-canvas-subtle);border:1px solid var(--gh-border-default);border-radius:var(--r);padding:12px 14px;font-size:13px;}
.card.soon{border-color:var(--gh-attention-fg);}
.card.empty{background:transparent;border-style:dashed;color:var(--gh-fg-subtle);}
.card-hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.card-house{font-size:20px;font-weight:600;}
.card-day{font-size:14px;font-weight:600;color:var(--gh-fg-muted);white-space:nowrap;}
.card-sub{font-size:12px;color:var(--gh-fg-subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-pills{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0;min-height:24px;align-items:center;}
.card-next{border-top:1px solid var(--gh-border-muted);padding-top:10px;}
.card-what{font-size:12px;color:var(--gh-fg-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-when{display:flex;align-items:center;gap:8px;margin-top:3px;white-space:nowrap;}
.card-date{font-size:15px;font-weight:600;}
.badge{font-size:11px;font-weight:500;padding:1px 8px;border-radius:8px;background:var(--gh-canvas-inset);color:var(--gh-fg-muted);}
.badge.warn{background:var(--gh-attention-subtle);color:var(--gh-attention-fg);}
.muted{color:var(--gh-fg-muted);font-size:12px;}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:500;white-space:nowrap;}
/* colours shared by cards and timeline */
.c-feed{background:var(--gh-success-subtle);color:var(--gh-success-fg);}
.c-feed.alt{background:rgba(79,209,139,0.22);}
.c-Avidecoxx{background:rgba(167,139,250,0.16);color:#b9a5ff;}
.c-Robenz{background:rgba(255,146,87,0.16);color:#ff9e6b;}

/* TIMELINE */
.tl-wrap{border:1px solid var(--gh-border-default);border-radius:var(--r);background:var(--gh-canvas-subtle);padding:12px 14px;margin-bottom:16px;}
.tl-legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--gh-fg-muted);margin-bottom:8px;}
.tl-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;}
.tl-axis{position:relative;height:16px;margin-left:120px;font-size:11px;color:var(--gh-fg-subtle);}
.tl-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--gh-border-muted);}
.tl-tracks{position:relative;}
.tl-track{position:relative;height:20px;margin:3px 0;}
.tl-seg{cursor:pointer;position:absolute;top:0;bottom:0;border-radius:4px;padding:0 6px;font-size:11px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tl-seg.now{box-shadow:inset 0 0 0 1.5px currentColor;font-weight:600;}
.tl-today{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--gh-danger-fg);z-index:2;}

/* EDIT TABLE (folded) */
.edit-wrap summary{cursor:pointer;font-size:13px;font-weight:500;color:var(--gh-fg-muted);padding:6px 0 10px;}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gh-canvas-subtle);border:1px solid var(--gh-border-default);border-radius:var(--r);padding:8px 16px;font-size:13px;color:var(--gh-fg-default);z-index:999;opacity:0;transition:opacity 0.2s;pointer-events:none;}
.toast.show{opacity:1}
</style>
</head>

      <span><i style="width:10px;height:2px;background:var(--gh-danger-fg);vertical-align:3px"></i><span data-t>Σήμερα</span></span>

  </details>
</div>

<script>

  'Άδειο': 'No flock', 'Δεν έχει εκκολαφθεί ακόμα': 'Not hatched yet',
  'Δεν υπάρχει πρόγραμμα σιτηρεσίων για αυτή τη ράτσα': 'No feed schedule for this breed', 'Δεν έχει οριστεί ράτσα': 'No breed set',
  'Καμία άλλη αλλαγή': 'No more changes', 'Εκκόλαψη {when}': 'Hatches {when}', 'Ημέρα {n}': 'Day {n}',

  'μέχρι να αδειάσει ο θάλαμος': 'until the house is emptied',
  'Δεν υπάρχουν κοπάδια ακόμα — ανοίξτε «Επεξεργασία κοπαδιών» ή κάντε συγχρονισμό από τον Προγραμματισμό.': 'No flocks yet — open "Edit flocks" or sync from the scheduler.',

  'Δεν άλλαξαν:': 'Not changed:',
  'Εφαρμόστηκαν {k} από {n} αλλαγές': '{k} of {n} changes applied', 'Εφαρμόστηκε {k} από {n} αλλαγή': '{k} of {n} change applied',
  'Μη έγκυρη ημερομηνία — χρησιμοποιήστε ηη/μμ/εε ή ηη/μμ/εεεε': 'Invalid date — use dd/mm/yy or dd/mm/yyyy',

// ── CONFIG ───────────────────────────────────────────────────────


// ── FEED SCHEDULES ── breeds, phases, additives, aviaries and the weekend rule live in common.js (FEED RULES)

// Scheduler (placements) breed → breed name used here
const SCHEDULER_BREED = { 'ISA': 'ISA Brown', 'Hy-Line': 'Hy-Line Brown', 'Novogen': 'Novogen Brown',
  'H&N White': 'H&N White', 'H&N Brown': 'H&N Brown', 'H&N Coral': 'H&N Coral' };

const REARING_TYPES = ['Cage', 'Barn'];
const HOUSES     = ['Θ1','Θ2','Θ3','Θ4','Θ5'];
const NUM_ROWS   = 6;
const TL_BACK = 56, TL_AHEAD = 112;   // timeline window: 8 weeks back, 16 weeks ahead

// ── STATE ────────────────────────────────────────────────────────
let rows       = Array.from({length: NUM_ROWS}, () => ({id: null, house:'', breed:'', hatch:'', rearing_type:''}));
let saveTimers = {};
let unsaved    = new Set();   // row indices edited but not yet confirmed saved
let isOnline   = false;   // gate — no edits until Supabase confirmed reachable

// ── ONLINE GATE ──────────────────────────────────────────────────
function setOnline(online) {
  isOnline = online;
  document.getElementById('offline-overlay').classList.toggle('active', !online);
  // Enable / disable all inputs
  document.querySelectorAll('.cell-input, .date-text-input').forEach(el => {
    el.disabled = !online;
  });
}

// Unsaved edits are pushed first, so the reload doesn't throw them away
async function retryConnection() {
  setSyncState('loading', t('Σύνδεση…'));
  for (const i of [...unsaved]) await persistRow(i);
  if (!unsaved.size) await loadFromSupabase();   // otherwise still no connection — edits kept, stay offline
}

// ── SUPABASE HELPERS ─────────────────────────────────────────────
// sbFetch (every read/write to Supabase) lives in common.js

// ── LOAD FROM SUPABASE ───────────────────────────────────────────
async function loadFromSupabase() {
  setSyncState('loading', t('Σύνδεση…'));
  try {
    const data = await sbFetch('feed_hatches?select=*&order=row_index.asc');
    rows = Array.from({length: NUM_ROWS}, () => ({id: null, house:'', breed:'', hatch:'', rearing_type:''}));
    for (const rec of data) {
      const idx = rec.row_index;
      if (idx >= 0 && idx < NUM_ROWS) {
        rows[idx] = {
          id:    rec.id,
          house: rec.house || '',
          breed: rec.breed || '',
          hatch: rec.hatch || '',
          rearing_type: rec.rearing_type || ''
        };
      }
    }
    setOnline(true);
    setSyncState('ok', t('Συγχρονίστηκε'));
    buildRows();
    focusFromLink(q => [...document.querySelectorAll('.card')].filter(c => c.querySelector('.card-house').textContent === q.get('house')));
  } catch(e) {
    console.error('Load error:', e);
    setOnline(false);
    setSyncState('err', t('Χωρίς σύνδεση'));
    buildRows();   // render read-only state with whatever is in rows
  }
}

// focusFromLink (dashboard-link highlight) lives in common.js

// ── SAVE ROW (debounced 600ms) ───────────────────────────────────
function saveRow(idx) {
  if (!isOnline) return;
  unsaved.add(idx);
  clearTimeout(saveTimers[idx]);
  saveTimers[idx] = setTimeout(() => persistRow(idx), 600);
}

// Returns true once the row is in Supabase; on failure the row stays in `unsaved`
async function persistRow(idx) {
  const r = rows[idx];
  setSyncState('saving', t('Αποθήκευση…'));
  try {
    const payload = {
      row_index: idx,
      house: r.house || null,
      breed: r.breed || null,
      hatch: r.hatch || null,
      rearing_type: r.rearing_type || null
    };
    if (r.id) {
      await sbFetch(`feed_hatches?id=eq.${r.id}`, {
        method: 'PATCH',
        prefer: 'return=representation',
        body: JSON.stringify(payload)
      });
    } else {
      const result = await sbFetch('feed_hatches', {
        method: 'POST',
        prefer: 'return=representation',
        body: JSON.stringify(payload)
      });
      if (result && result[0]) rows[idx].id = result[0].id;
    }
    unsaved.delete(idx);
    setSyncState('ok', t('Αποθηκεύτηκε ✓'));
    setTimeout(() => setSyncState('ok', t('Συγχρονίστηκε')), 1500);
    return true;
  } catch(e) {
    console.error('Save error:', e);
    if (e.status) {
      // The database refused this save — retrying won't help. Drop it and show what's really stored.
      unsaved.delete(idx);
      showToast(t('Η βάση απέρριψε την αποθήκευση ({n}) — έγινε επαναφόρτωση', { n: e.status }));
      loadFromSupabase();
      return false;
    }
    unsaved.add(idx);   // a newer edit may have been cleared by an earlier save's success
    setOnline(false);
    setSyncState('err', t('Χωρίς σύνδεση'));
    return false;
  }
}

// ── DATE HELPERS ─────────────────────────────────────────────────
// Parse flexible date input: dd/mm/yy, dd/mm/yyyy, dd-mm-yy, dd-mm-yyyy
// Returns ISO string "YYYY-MM-DD" or null if invalid.
function parseFlexDate(raw) {
  if (!raw) return null;
  const s = raw.trim().replace(/-/g, '/');
  const parts = s.split('/');
  if (parts.length !== 3) return null;

  const dd  = parseInt(parts[0], 10);
  const mm  = parseInt(parts[1], 10);
  let   yy  = parseInt(parts[2], 10);

  if (isNaN(dd) || isNaN(mm) || isNaN(yy)) return null;

  // Year must be 2 digits (→ 20yy) or 4 digits
  const ylen = parts[2].trim().length;
  if (ylen === 2) yy += 2000;
  else if (ylen !== 4) return null;

  // Reject impossible days (31/02, 31/04…) — Date would silently roll them into the next month
  const d = new Date(Date.UTC(yy, mm - 1, dd));
  if (d.getUTCFullYear() !== yy || d.getUTCMonth() !== mm - 1 || d.getUTCDate() !== dd) return null;
  return `${yy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
}

function isoToDisplay(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function addDays(iso, days) {
  if (!iso) return null;
  const d = new Date(iso);
  d.setDate(d.getDate() + days);
  return d;
}

function fmtDate(d) {
  if (!d) return null;
  return d.toLocaleDateString('en-GB', {day:'2-digit', month:'2-digit', year:'numeric'});
}

// ── HOUSE EXCLUSIVITY ────────────────────────────────────────────
// Returns set of house values currently used (excluding the given rowIdx)
function usedHouses(excludeIdx) {
  const used = new Set();
  rows.forEach((r, i) => { if (i !== excludeIdx && r.house) used.add(r.house); });
  return used;
}

// Refresh all house dropdowns to disable already-selected houses in other rows
function refreshHouseDropdowns() {
  for (let i = 0; i < NUM_ROWS; i++) {
    const sel = document.getElementById(`house-${i}`);
    if (!sel) continue;
    const used = usedHouses(i);
    Array.from(sel.options).forEach(opt => {
      if (!opt.value) return;   // skip the blank "—" option
      opt.disabled = used.has(opt.value);
    });
  }
}

// ── BUILD HEADER ─────────────────────────────────────────────────
function buildHeader() {
  document.getElementById('header-row').innerHTML =
    `<th style="min-width:130px">${t('Ημ. Εκκόλαψης')}</th><th style="min-width:80px">${t('Θάλαμος')}</th><th style="min-width:110px">${t('Ράτσα')}</th><th style="min-width:90px">${t('Τύπος')}</th><th style="min-width:80px">${t('Ηλικία')}</th>`;
}

// ── SORT ─────────────────────────────────────────────────────────
// Display order only — row identity (index, id, persistence) never changes.
// Oldest hatch date first; blanks always sort last; ties keep original order.
function sortedIndices() {
  return Array.from({length: NUM_ROWS}, (_, i) => i).sort((a, b) => {
    const ha = rows[a].hatch, hb = rows[b].hatch;
    if (!ha && !hb) return 0;
    if (!ha) return 1;
    if (!hb) return -1;
    return ha < hb ? -1 : ha > hb ? 1 : 0;
  });
}

// ── BUILD ROWS ────────────────────────────────────────────────────
function buildRows() {
  const tbody = document.getElementById('table-body');
  let html = '';
  for (const i of sortedIndices()) {
    const r = rows[i];
    const displayHatch = isoToDisplay(r.hatch);

    html += `<tr id="row-${i}">`;

    // Hatch date — text input with flex parsing
    html += `<td>
      <input type="text"
        class="date-text-input"
        id="hatch-${i}"
        value="${displayHatch}"
        placeholder="${t('ηη/μμ/εε')}"
        maxlength="10"
        autocomplete="off"
        ${!isOnline ? 'disabled' : ''}
        onblur="onHatchBlur(${i}, this, event)"
        onkeydown="if(event.key==='Enter')this.blur()">
    </td>`;

    // House dropdown
    html += `<td><select class="cell-input" id="house-${i}" onchange="onHouseChange(${i},this.value)" ${!isOnline ? 'disabled' : ''}>
      <option value="">—</option>
      ${HOUSES.map(h => `<option value="${h}"${r.house===h?' selected':''}>${h}</option>`).join('')}
    </select></td>`;

    // Breed dropdown
    html += `<td><select class="cell-input" id="breed-${i}" onchange="onBreedChange(${i},this.value)" ${!isOnline ? 'disabled' : ''}>
      <option value="">—</option>
      ${Object.keys(BREED_SCHEDULE).map(b => `<option value="${b}"${r.breed===b?' selected':''}>${b}</option>`).join('')}
    </select></td>`;

    // Rearing type dropdown
    html += `<td><select class="cell-input" id="type-${i}" onchange="onRearingTypeChange(${i},this.value)" ${!isOnline ? 'disabled' : ''}>
      <option value="">—</option>
      ${REARING_TYPES.map(type => `<option value="${type}"${r.rearing_type===type?' selected':''}>${typeLabel(type)}</option>`).join('')}
    </select></td>`;

    html += `<td style="white-space:nowrap">${ageText(r.hatch)}</td>`;
    html += '</tr>';
  }
  tbody.innerHTML = html;

  refreshHouseDropdowns();
  renderOverview();
}

// ── PHASES ────────────────────────────────────────────────────────
// Shared by the cards, the timeline and printSummary so the "current" phase
// is always computed the same way. Returns null if the row is incomplete.
function computeActivePhase(r) {
  if (!r.breed || !r.hatch) return null;
  const scheduleKey = BREED_SCHEDULE[r.breed];
  if (!scheduleKey) return null;   // breed has no schedule assigned yet
  const today = new Date(); today.setHours(0,0,0,0);
  const breed = BREEDS[scheduleKey];

  // Build all phase Date objects once per row (not once per phase).
  // Weekend changes move to a weekday — Saturday → Friday, Sunday → Monday —
  // the same rule as the reminder email (feed_notify.yml), so both name the same day.
  const phaseDates = breed.days.map(d => {
    const dt = addDays(r.hatch, d);
    dt.setHours(0,0,0,0);
    toWeekday(dt);
    return dt;
  });

  // Active phase = last index whose start date is today or in the past
  let activeIdx = -1;
  for (let i = 0; i < phaseDates.length; i++) {
    if (phaseDates[i] <= today) activeIdx = i;
  }

  return { breed, phaseDates, activeIdx };
}

// Additive spans for a hatch date. Starts move off weekends like the feed phases;
// each additive's end is the next one's start (the switch day), the last has none.
// now = in the feed today.
function additiveSpans(r) {
  const hatch = r.hatch;
  if (!hatch || NO_ADDITIVES_HOUSES.includes(r.house)) return [];
  const today = new Date(); today.setHours(0,0,0,0);
  const starts = ADDITIVES.map(a => {
    const dt = addDays(hatch, a.from); dt.setHours(0,0,0,0);
    toWeekday(dt);
    return dt;
  });
  return ADDITIVES.map((a, i) => {
    const start = starts[i], end = starts[i + 1] || null;
    return { name: a.name, start, end, now: start <= today && (!end || today < end) };
  });
}

// Type is saved in English (Cage / Barn); shown as Κλουβί / Δάπεδο in Greek, back to Cage / Barn in English
const TYPE_LABEL = { Cage: 'Κλουβί', Barn: 'Δάπεδο' };
const typeLabel = type => TYPE_LABEL[type] ? t(TYPE_LABEL[type]) : type;

// Age in days since hatch (hatch day = 0); '—' with no hatch date or before hatching
function ageText(hatch) {
  if (!hatch) return '—';
  const h = addDays(hatch, 0); h.setHours(0,0,0,0);
  const today = new Date(); today.setHours(0,0,0,0);
  const days = Math.round((today - h) / 86400000);
  return days < 0 ? '—' : t(days === 1 ? '{n} ημέρα' : '{n} ημέρες', { n: days });
}

// ── OVERVIEW: house cards + timeline ─────────────────────────────
function renderOverview() { renderCards(); renderTimeline(); }

const DAY = 86400000;
const WD = ['Κυρ', 'Δευ', 'Τρί', 'Τετ', 'Πέμ', 'Παρ', 'Σάβ'];   // translated by the shared list in common.js
const fmtShort = d => `${t(WD[d.getDay()])} ${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`;
const inDays = n => n === 0 ? t('σήμερα') : t(n === 1 ? 'σε {n} ημέρα' : 'σε {n} ημέρες', { n });

// Feed phases as spans: each runs until the next starts, the last has no end
function feedSpans(r) {
  const a = computeActivePhase(r);
  if (!a) return [];
  return a.phaseDates.map((start, i) => ({
    name: a.breed.phases[i], start, end: a.phaseDates[i + 1] || null, now: i === a.activeIdx
  }));
}

function renderCards() {
  const today = new Date(); today.setHours(0,0,0,0);
  document.getElementById('cards').innerHTML = HOUSES.map(h => {
    const r = rows.find(x => x.house === h && x.hatch);
    if (!r) return `<div class="card empty"><div class="card-hd"><span class="card-house">${h}</span></div><div class="card-sub">${t('Άδειο')}</div></div>`;

    const hatch = addDays(r.hatch, 0); hatch.setHours(0,0,0,0);
    const age = Math.round((today - hatch) / DAY);
    const feed = feedSpans(r), adds = additiveSpans(r);
    const next = [...feed, ...adds].filter(x => x.start >= today).sort((a, b) => a.start - b.start);   // today included: the switch is due
    const nextIn = next.length ? Math.round((next[0].start - today) / DAY) : null;
    const soon = nextIn !== null && nextIn <= 7;

    let now;
    if (age < 0) now = `<span class="muted">${t('Δεν έχει εκκολαφθεί ακόμα')}</span>`;
    else {
      const f = feed.find(x => x.now);
      now = (f ? `<span class="pill c-feed">${f.name}</span>`
               : feed.length ? ''   // first feed moved off a weekend hatch day — Next shows it
               : `<span class="muted">${t(r.breed ? 'Δεν υπάρχει πρόγραμμα σιτηρεσίων για αυτή τη ράτσα' : 'Δεν έχει οριστεί ράτσα')}</span> `)
          + adds.filter(x => x.now).map(x => `<span class="pill c-${x.name}">${x.name}</span>`).join('');
    }
    // Next change only — the timeline below shows the rest
    const nextHtml = next.length
      ? `<div class="card-what">→ ${next[0].name}</div>
         <div class="card-when"><span class="card-date">${fmtShort(next[0].start)}</span><span class="badge${soon ? ' warn' : ''}">${nextIn === 0 ? t('Σήμερα') : t(nextIn === 1 ? '{n} ημέρα' : '{n} ημέρες', { n: nextIn })}</span></div>`
      : `<div class="card-what">${t('Καμία άλλη αλλαγή')}</div>`;

    return `<div class="card${soon ? ' soon' : ''}">
      <div class="card-hd"><span class="card-house">${h}</span><span class="card-day">${age < 0 ? t('Εκκόλαψη {when}', { when: inDays(-age) }) : t('Ημέρα {n}', { n: age })}</span></div>
      <div class="card-sub">${r.breed || t('Χωρίς ράτσα')} · ${r.rearing_type ? typeLabel(r.rearing_type) : t('Χωρίς τύπο')}</div>
      <div class="card-pills">${now}</div>
      <div class="card-next">${nextHtml}</div>
    </div>`;
  }).join('');
}

function renderTimeline() {
  const today = new Date(); today.setHours(0,0,0,0);
  const from = new Date(today); from.setDate(from.getDate() - TL_BACK);
  const to   = new Date(today); to.setDate(to.getDate() + TL_AHEAD);
  const pos = d => (Math.min(Math.max(d, from), to) - from) / (to - from) * 100;

  const ticks = [];
  for (let m = new Date(from.getFullYear(), from.getMonth() + 1, 1); m < to; m.setMonth(m.getMonth() + 1))
    ticks.push(`<span style="position:absolute;left:${pos(m)}%">${m.toLocaleDateString(LANG === 'en' ? 'en-GB' : 'el-GR', {month:'short'})}</span>`);
  document.getElementById('tl-axis').innerHTML = ticks.join('');

  const segs = (spans, cls) => spans.map((x, i) => {
    const end = x.end || to;
    if (end <= from || x.start >= to) return '';
    const c = cls === 'feed' ? `c-feed${i % 2 ? ' alt' : ''}` : `c-${x.name}`;
    const tip = `${x.name}: ${fmtDate(x.start)} → ${x.end ? fmtDate(x.end) : t('μέχρι να αδειάσει ο θάλαμος')}`;
    return `<div class="tl-seg ${c}${x.now ? ' now' : ''}" style="left:${pos(x.start)}%;width:${pos(end) - pos(x.start)}%" title="${tip}" onclick="showToast(this.title)">${x.name}</div>`;
  }).join('');

  const order = r => r.house ? HOUSES.indexOf(r.house) : HOUSES.length;
  const flocks = rows.filter(r => r.hatch).sort((a, b) => order(a) - order(b));
  document.getElementById('timeline').innerHTML = flocks.length ? flocks.map(r => {
    const age = Math.round((today - addDays(r.hatch, 0).setHours(0,0,0,0)) / DAY);
    return `<div class="tl-row">
      <div><div style="font-weight:600">${r.house || '—'}</div><div class="muted">${r.breed || t('Χωρίς ράτσα')}</div><div class="muted">${age < 0 ? t('Εκκόλαψη {when}', { when: inDays(-age) }) : t('Ημέρα {n}', { n: age })}</div></div>
      <div class="tl-tracks">
        <div class="tl-track">${segs(feedSpans(r), 'feed')}</div>
        <div class="tl-track">${segs(additiveSpans(r), 'add')}</div>
        <div class="tl-today" style="left:${pos(today)}%"></div>
      </div>
    </div>`;
  }).join('') : `<div class="muted" style="padding:8px 0">${t('Δεν υπάρχουν κοπάδια ακόμα — ανοίξτε «Επεξεργασία κοπαδιών» ή κάντε συγχρονισμό από τον Προγραμματισμό.')}</div>`;
}

// ── PRINT SUMMARY ─────────────────────────────────────────────────
function printSummary() {
  const lines = [];
  for (let i = 0; i < NUM_ROWS; i++) {
    const r = rows[i];
    if (!r.house || !r.breed || !r.hatch || !r.rearing_type) continue;
    const active = computeActivePhase(r);
    if (!active || active.activeIdx < 0) continue;   // no phase currently active
    const phaseLabel = active.breed.phases[active.activeIdx];
    const inUse = additiveSpans(r).filter(a => a.now).map(a => a.name);
    lines.push({
      house: r.house,
      text: `${t('Ημ. Εκκόλαψης')}: ${isoToDisplay(r.hatch)}, ${r.house}, ${r.breed}, ${typeLabel(r.rearing_type)}, ${phaseLabel}${inUse.length ? ', ' + inUse.join(' + ') : ''}`
    });
  }
  lines.sort((a, b) => parseInt(a.house.slice(1), 10) - parseInt(b.house.slice(1), 10));

  const win = window.open('', '_blank');
  if (!win) { showToast(t('Επιτρέψτε τα αναδυόμενα παράθυρα για να εκτυπωθεί η σύνοψη')); return; }
  win.document.write(`<!DOCTYPE html><html><head><title>${t('Ζωοτροφές — Τρέχουσα κατάσταση')}</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;color:#000;background:#fff;padding:24px}
h1{font-size:18px;margin-bottom:4px}
.date{font-size:13px;color:#555;margin-bottom:20px}
.line{font-size:14px;margin-bottom:8px}
</style></head><body>
<h1>${t('Ζωοτροφές — Τρέχουσα κατάσταση')}</h1>
<div class="date">${fmtDate(new Date())}</div>
${lines.map(l => `<div class="line">${l.text}</div>`).join('')}
</body></html>`);
  win.document.close();
  win.focus();
  win.print();
}

// ── SYNC FROM SCHEDULER ───────────────────────────────────────────
// For each house: the latest scheduler hatch that is today or earlier.
// Sets hatch + breed (breed kept if the scheduler has none); a house with no row
// fills an empty one (Type left blank). Each change is asked one by one; only the accepted ones are saved.
// ponytail: takes the latest past hatch even if that flock already left — the confirm list is the check
async function syncFromScheduler() {
  if (!isOnline) return;
  const now = new Date();
  const todayIso = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  let data;
  try {
    data = await sbFetch(`placements?select=house,doc_date,breed&doc_date=lte.${todayIso}&order=doc_date.desc`);
  } catch (e) {
    console.error('Sync load error:', e);
    showToast(t('Δεν ήταν δυνατή η ανάγνωση του Προγραμματισμού — δεν άλλαξε τίποτα'));
    return;
  }
  const latest = {};
  for (const p of data) if (HOUSES.includes(p.house) && !latest[p.house]) latest[p.house] = p;

  const changes = [], lines = [], problems = [];
  const taken = new Set();
  for (const h of HOUSES) {
    const p = latest[h];
    if (!p) continue;
    const breed = p.breed ? SCHEDULER_BREED[p.breed] : null;
    if (p.breed && !breed) { problems.push(`${h}: ${t('άγνωστη ράτσα στον Προγραμματισμό «{breed}» — παραλείφθηκε', { breed: p.breed })}`); continue; }
    const idx = rows.findIndex(r => r.house === h);
    if (idx < 0) {
      const empty = rows.findIndex((r, i) => !r.house && !r.hatch && !r.breed && !taken.has(i));
      if (empty < 0) { problems.push(`${h}: ${t('δεν υπάρχει κενή γραμμή — παραλείφθηκε')}`); continue; }
      taken.add(empty);
      changes.push({ idx: empty, house: h, hatch: p.doc_date, breed: breed || '' });
      lines.push(`${h}: ${t('νέα γραμμή — εκκόλαψη {date}{breed} (ορίστε τον Τύπο μόνοι σας)', { date: isoToDisplay(p.doc_date), breed: breed ? ', ' + breed : '' })}`);
      continue;
    }
    const r = rows[idx];
    const parts = [];
    if (r.hatch !== p.doc_date) parts.push(t('εκκόλαψη {from} → {to}', { from: r.hatch ? isoToDisplay(r.hatch) : '—', to: isoToDisplay(p.doc_date) }));
    if (breed && r.breed !== breed) parts.push(t('ράτσα {from} → {to}', { from: r.breed || '—', to: breed }));
    if (!parts.length) continue;
    changes.push({ idx, house: h, hatch: p.doc_date, breed: breed || r.breed });
    lines.push(`${h}: ${parts.join(', ')}`);
  }

  if (!changes.length) {
    if (problems.length) alert(problems.join('\n'));
    else showToast(t('Είναι ήδη συγχρονισμένο'));
    return;
  }
  let applied = 0;
  changes.forEach((c, k) => {
    if (!confirm(t('Αλλαγή {k} από {n} από τον Προγραμματισμό:', { k: k + 1, n: changes.length }) + `\n\n${lines[k]}\n\n` + t('Να εφαρμοστεί;'))) return;
    Object.assign(rows[c.idx], { house: c.house, hatch: c.hatch, breed: c.breed });
    saveRow(c.idx);
    applied++;
  });
  if (problems.length) alert(t('Δεν άλλαξαν:') + '\n' + problems.join('\n'));
  if (applied) buildRows();
  showToast(t(changes.length > 1 ? 'Εφαρμόστηκαν {k} από {n} αλλαγές' : 'Εφαρμόστηκε {k} από {n} αλλαγή', { k: applied, n: changes.length }));
}

// ── EVENT HANDLERS ────────────────────────────────────────────────
function onHatchBlur(idx, input, ev) {
  if (!isOnline) return;
  const raw = input.value.trim();
  const iso = raw ? parseFlexDate(raw) : '';   // blank = cleared (row sorts to the bottom)
  if (iso === null) {
    input.classList.add('invalid');
    showToast(t('Μη έγκυρη ημερομηνία — χρησιμοποιήστε ηη/μμ/εε ή ηη/μμ/εεεε'));
    return;
  }
  input.classList.remove('invalid');
  input.value = isoToDisplay(iso);
  if (iso === rows[idx].hatch) return;   // unchanged — no save, no redraw, Tab keeps going
  rows[idx].hatch = iso;
  saveRow(idx);
  // Re-render in chronological order, then put focus back where Tab/click was heading
  const nextId = ev && ev.relatedTarget && ev.relatedTarget.id;
  buildRows();
  if (nextId) document.getElementById(nextId)?.focus();
}

function onHouseChange(idx, val) {
  if (!isOnline) return;
  rows[idx].house = val;
  refreshHouseDropdowns();
  renderOverview();
  saveRow(idx);
}

function onBreedChange(idx, val) {
  if (!isOnline) return;
  rows[idx].breed = val;
  renderOverview();
  saveRow(idx);
}

function onRearingTypeChange(idx, val) {
  if (!isOnline) return;
  rows[idx].rearing_type = val;
  renderOverview();
  saveRow(idx);
}

// ── ZOOM ──────────────────────────────────────────────────────────
let zoom = 1;
try { zoom = parseFloat(localStorage.getItem('feed_zoom') || '1'); } catch (e) {}   // storage blocked: default size
function applyZoom() {
  zoom = Math.max(0.5, Math.min(2, Math.round(zoom * 10) / 10));
  const m = document.getElementById('main');
  m.style.transform      = `scale(${zoom})`;
  m.style.width          = `calc(100% / ${zoom})`;
  m.style.transformOrigin = 'top left';
  document.getElementById('zoom-label').textContent = Math.round(zoom * 100) + '%';
  try { localStorage.setItem('feed_zoom', zoom); } catch (e) {}
}
function changeZoom(delta) { zoom += delta; applyZoom(); }


// ── TOAST ─────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// ── INIT ──────────────────────────────────────────────────────────
applyZoom();
buildHeader();
// A tab left open overnight would keep yesterday's "today" — redraw when it's shown again
document.addEventListener('visibilitychange', () => { if (!document.hidden) renderOverview(); });

// shared sign-in, load-once guard and home/Έξοδος buttons: common.js
// unsaved work = edited rows not yet confirmed saved (asked before switching language)
startPage({ onSignedIn: () => loadFromSupabase(), translated: true, hasUnsavedWork: () => unsaved.size > 0 });
</script>
