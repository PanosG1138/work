<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Georgasopoulos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.min.js"></script>
<script src="common.js?v=14"></script>
<link rel="stylesheet" href="theme.css?v=14">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:var(--gh-canvas-default);
  color:var(--gh-fg-default);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:14px;line-height:1.5;
  display:flex;flex-direction:column;min-height:100vh;
}
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;height:48px;
  border-bottom:1px solid var(--gh-border-default);
  flex-shrink:0;
}
.header-left{display:flex;align-items:center;gap:10px}
.logo{font-weight:600;font-size:15px;color:var(--gh-fg-default)}
main{
  flex:1;display:flex;flex-direction:column;align-items:center;
  padding:28px 24px 40px;
}

/* ── DASHBOARD: one tile per rearing house ── */
.dash{width:100%;max-width:1060px;margin-bottom:44px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;min-height:34px}
.pill{background:var(--gh-canvas-subtle);border:1px solid var(--gh-border-muted);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--gh-fg-muted);text-decoration:none}
.pill b{color:var(--gh-fg-default);font-weight:600}
a.pill:hover{border-color:var(--gh-border-default);color:var(--gh-fg-default)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{background:var(--gh-canvas-subtle);border:1px solid var(--gh-border-default);border-radius:16px;padding:14px 16px}
.tile.empty{background:transparent;border-style:dashed}
.tile.empty .t-house{color:var(--gh-fg-subtle)}
.t-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ring{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.ring span{width:38px;height:38px;border-radius:50%;background:var(--gh-canvas-subtle);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--gh-fg-muted)}
.tile.empty .ring span{background:var(--gh-canvas-default)}
.t-house{font-size:19px;font-weight:600;line-height:1.1}
.t-sub{font-size:12px;color:var(--gh-fg-muted)}
.ln{display:flex;gap:9px;align-items:baseline;padding:6px 0;border-top:1px solid var(--gh-border-muted);color:inherit;text-decoration:none}
a.ln:hover .ln-what{color:var(--gh-fg-default)}
.ln i{font-size:15px;color:var(--gh-fg-subtle);width:16px;flex-shrink:0;position:relative;top:2px}
.ln-when{font-weight:600;white-space:nowrap}
.ln-what{color:var(--gh-fg-muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ln.none .ln-when{color:var(--gh-fg-subtle);font-weight:400}
.ln.soon .ln-when{color:var(--gh-attention-fg)}
.warn{color:var(--gh-attention-fg)}
.ok{color:var(--gh-success-fg)}
.dash-msg{font-size:13px;color:var(--gh-fg-muted);padding:8px 0}
.dash-msg.err{color:var(--gh-danger-fg)}

/* sign-in, shown in place of the dashboard */

/* ── TOOL LINKS, grouped ── */
.groups{width:100%;max-width:1060px}
.sec{font-size:11px;font-weight:600;color:var(--gh-fg-subtle);text-transform:uppercase;letter-spacing:0.06em;margin:0 0 8px 2px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:22px}
.tool{display:flex;align-items:center;gap:12px;background:var(--gh-canvas-subtle);border:1px solid var(--gh-border-default);border-radius:14px;padding:12px 14px;text-decoration:none;color:inherit;transition:border-color 0.15s,background 0.15s}
.tool:hover{border-color:var(--gh-fg-subtle);background:var(--gh-hover-bg)}
.tool-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:19px;flex-shrink:0}
.tool-name{font-size:14px;font-weight:600;color:var(--gh-fg-default)}
.tool-desc{font-size:12px;color:var(--gh-fg-muted)}
.tool .arrow{margin-left:auto;color:var(--gh-fg-subtle);font-size:16px;transition:transform 0.15s,color 0.15s}
.tool:hover .arrow{color:var(--gh-fg-default);transform:translateX(2px)}
.ic-blue{background:var(--gh-accent-subtle);color:var(--gh-accent-fg)}
.ic-green{background:var(--gh-success-subtle);color:var(--gh-success-fg)}
.ic-amber{background:var(--gh-attention-subtle);color:var(--gh-attention-fg)}
.ic-purple{background:rgba(163,113,247,0.12);color:#b69cff}
footer{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:4px;padding-top:12px;
  border-top:1px solid var(--gh-border-muted);
}
.card-tag{
  font-size:11px;font-weight:500;padding:2px 8px;border-radius:99px;
}
.tag-blue{background:var(--gh-accent-subtle);color:var(--gh-accent-fg);border:1px solid rgba(110,143,255,0.25)}
.tag-green{background:var(--gh-success-subtle);color:var(--gh-success-fg);border:1px solid rgba(79,209,139,0.25)}
.tag-amber{background:var(--gh-attention-subtle);color:var(--gh-attention-fg);border:1px solid rgba(240,180,41,0.25)}
.tag-purple{background:rgba(163,113,247,0.08);color:#a371f7;border:1px solid rgba(163,113,247,0.25)}
.card-arrow{font-size:14px;color:var(--gh-fg-subtle);transition:color 0.15s,transform 0.15s}
.card:hover .card-arrow{color:var(--gh-accent-fg);transform:translateX(3px)}
footer{
  text-align:center;padding:16px;
  font-size:11px;color:var(--gh-fg-subtle);
  border-top:1px solid var(--gh-border-muted);
  flex-shrink:0;
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <span class="logo">🐔 Georgasopoulos</span>
  </div>
  <span id="common-nav"></span>
</header>

<main>
  <!-- DASHBOARD — needs sign-in (same account as the tools) -->
  <section class="dash" id="dash" style="display:none">
    <div class="sec" data-t>Θάλαμοι</div>
    <div class="pills" id="pills"></div>
    <div class="tiles" id="tiles"><div class="dash-msg" data-t>Φόρτωση…</div></div>
  </section>

  <!-- shared sign-in box, drawn here by common.js when nobody is signed in -->
  <div id="common-signin"></div>

  <div class="groups">
    <div class="sec" data-t>Εκτροφή</div>
    <div class="tools">
      <a class="tool" href="vaccine_tracker.html"><span class="tool-ic ic-blue"><i class="ti ti-vaccine" aria-hidden="true"></i></span>
        <span><span class="tool-name" data-t>Εμβόλια</span><br><span class="tool-desc" data-t>Παραγγελίες και εμβολιασμοί ανά κοπάδι</span></span><i class="ti ti-chevron-right arrow" aria-hidden="true"></i></a>
      <a class="tool" href="inventory.html"><span class="tool-ic ic-blue"><i class="ti ti-package" aria-hidden="true"></i></span>
        <span><span class="tool-name" data-t>Απόθεμα</span><br><span class="tool-desc" data-t>Απόθεμα εμβολίων</span></span><i class="ti ti-chevron-right arrow" aria-hidden="true"></i></a>
      <a class="tool" href="feed_tracker.html"><span class="tool-ic ic-green"><i class="ti ti-grain" aria-hidden="true"></i></span>
        <span><span class="tool-name" data-t>Ζωοτροφές</span><br><span class="tool-desc" data-t>Σιτηρέσια και πρόσθετα ανά κοπάδι</span></span><i class="ti ti-chevron-right arrow" aria-hidden="true"></i></a>
      <a class="tool" href="schedule_checker.html"><span class="tool-ic ic-amber"><i class="ti ti-calendar" aria-hidden="true"></i></span>
        <span><span class="tool-name" data-t>Προγραμματισμός</span><br><span class="tool-desc" data-t>Εκκολάψεις ανά θάλαμο</span></span><i class="ti ti-chevron-right arrow" aria-hidden="true"></i></a>
    </div>
    <div class="sec" data-t>Φόρτωση</div>
    <div class="tools">
      <a class="tool" href="truck_calculator_kamposos.html"><span class="tool-ic ic-purple"><i class="ti ti-truck" aria-hidden="true"></i></span>
        <span><span class="tool-name">Καμπόσος</span><br><span class="tool-desc" data-t>Φόρτωση καρότσας</span></span><i class="ti ti-chevron-right arrow" aria-hidden="true"></i></a>
      <a class="tool" href="truck_calculator_doukakis.html"><span class="tool-ic ic-purple"><i class="ti ti-truck-delivery" aria-hidden="true"></i></span>
        <span><span class="tool-name">Δουκάκης</span><br><span class="tool-desc" data-t>Φόρτωση καρότσας</span></span><i class="ti ti-chevron-right arrow" aria-hidden="true"></i></a>
    </div>
  </div>
</main>

<footer data-t>PanosG1138 · Εσωτερική χρήση</footer>

<script>
// ── TRANSLATIONS ── this page's English (Greek text → English); shared words are in common.js
addTranslations({
  'Θάλαμοι': 'Houses', 'Φόρτωση…': 'Loading…', 'Εκτροφή': 'Rearing', 'Φόρτωση': 'Loading',
  'Εμβόλια': 'Vaccines', 'Παραγγελίες και εμβολιασμοί ανά κοπάδι': 'Orders and vaccinations per flock',
  'Απόθεμα': 'Stock', 'Απόθεμα εμβολίων': 'Vaccine stock',
  'Ζωοτροφές': 'Feed', 'Σιτηρέσια και πρόσθετα ανά κοπάδι': 'Feed phases and additives per flock',
  'Προγραμματισμός': 'Scheduling', 'Εκκολάψεις ανά θάλαμο': 'Hatches per house',
  'Φόρτωση καρότσας': 'Truck loading', 'PanosG1138 · Εσωτερική χρήση': 'PanosG1138 · Internal use',
  'Σήμερα': 'Today', 'Αύριο': 'Tomorrow',
  'επιβεβαιώθηκε': 'confirmed', 'ζητήθηκε': 'requested', 'χωρίς παραγγελία': 'not ordered',
  'καμία προγραμματισμένη': 'none planned', 'Άδειο': 'Empty',
  'εκκόλαψη σε {n} ημέρα': 'hatch in {n} day', 'εκκόλαψη σε {n} ημέρες': 'hatch in {n} days',
  'Σφάλμα φόρτωσης: {msg}': 'Loading error: {msg}', 'ή': 'or',
  'Εμβόλια: άλλη εκκόλαψη ({d})': 'Vaccines: different hatch ({d})', 'κανένας καταχωρημένος': 'none entered',
  'λείπει από Ζωοτροφές': 'missing from Feed', 'Ζωοτροφές: άλλη εκκόλαψη': 'Feed: different hatch',
  'καμία άλλη αλλαγή': 'no more changes', '{breed} · ημέρα {n}': '{breed} · day {n}',
  '{n} εμβολιασμός τις επόμενες 7 ημέρες': '{n} vaccination in the next 7 days',
  '{n} εμβολιασμοί τις επόμενες 7 ημέρες': '{n} vaccinations in the next 7 days',
  '{n} χωρίς παραγγελία': '{n} not ordered',
  '{n} δεν έχει έρθει': '{n} not arrived yet', '{n} δεν έχουν έρθει': '{n} not arrived yet',
  'Επόμενο σιτηρέσιο: {what}, {when}': 'Next feed: {what}, {when}',
});

// ── SIGN-IN ── shared sign-in, load-once guard and Έξοδος button: common.js
// signed in: show the house tiles and load them; signed out: hide them (common.js shows the box)
function showDashboard() { document.getElementById('dash').style.display = ''; loadDashboard(); }
function hideDashboard() { document.getElementById('dash').style.display = 'none'; }

// sbFetch (every read/write to Supabase) lives in common.js

// ── RULES ── houses: this page's own list (Θ7 hidden); loading and feed rules: common.js
const HOUSES = ['Θ1', 'Θ2', 'Θ3', 'Θ4', 'Θ5'];   // Θ7 left out until it's built (user, 2026-11-03)
// loading days and the house-empty day (emptyDay): common.js (LOADING RULES)
// feed phases + additives + the weekend rule: common.js (FEED RULES)

// ── DATES ─────────────────────────────────────────────────────────
const DAY = 86400000;
const WD = ['Κυρ','Δευ','Τρί','Τετ','Πέμ','Παρ','Σάβ'];
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const daysBetween = (a, b) => Math.round((b - a) / DAY);
const isoOf = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const ddmm = d => `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
// "Σήμερα", "Αύριο", "Σάβ 07/11"; another year gets its year: "25/01/27"
function when(d, today) {
  const n = daysBetween(today, d);
  if (n === 0) return t('Σήμερα');
  if (n === 1) return t('Αύριο');
  return d.getFullYear() === today.getFullYear() ? `${t(WD[d.getDay()])} ${ddmm(d)}` : `${ddmm(d)}/${String(d.getFullYear()).slice(2)}`;
}
// next feed phase or additive start on or after today for a feed_hatches row, or null
function nextFeed(r, today) {
  const hatch = parseISO(r.hatch);
  const key = BREED_SCHEDULE[r.breed];
  const events = key ? BREEDS[key].days.map((d, i) => ({ date: toWeekday(addDays(hatch, d)), name: BREEDS[key].phases[i] })) : [];
  if (!NO_ADDITIVES_HOUSES.includes(r.house))
    ADDITIVES.forEach(a => events.push({ date: toWeekday(addDays(hatch, a.from)), name: a.name }));
  return events.filter(e => e.date >= today).sort((a, b) => a.date - b.date)[0] || null;
}

function x(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
const STATUS = { 'Confirmed': ['επιβεβαιώθηκε', 'ok'], 'Requested': ['ζητήθηκε', ''], 'Not ordered': ['χωρίς παραγγελία', ''] };   // same words as schedule_checker.html (user)

// one line of a tile: icon, date (orange today/tomorrow), what — links to its tool
function line(icon, href, date, what, today, cls = '') {
  const soon = date && daysBetween(today, date) <= 1;
  return `<a class="ln${soon ? ' soon' : ''}${date ? '' : ' none'}" href="${href}"><i class="ti ti-${icon}" aria-hidden="true"></i>` +
    `<span class="ln-when">${date ? when(date, today) : '—'}</span><span class="ln-what ${cls}">${what}</span></a>`;
}

// ── DASHBOARD ─────────────────────────────────────────────────────
async function loadDashboard() {
  const today = new Date(); today.setHours(0,0,0,0);
  const todayIso = isoOf(today);
  let placements, vacc, feed;
  try {
    [placements, vacc, feed] = await Promise.all([
      sbFetch('placements?select=id,house,doc_date,breed,status,ptino&order=doc_date.asc'),
      sbFetch(`emvolia?select=anath,hm_ekk,hm_emv,emvolio,paragelia,psygeio&hm_emv=gte.${todayIso}&order=hm_emv.asc`),
      sbFetch('feed_hatches?select=house,breed,hatch'),
    ]);
  } catch (e) {
    document.getElementById('tiles').innerHTML = `<div class="dash-msg err">${t('Σφάλμα φόρτωσης: {msg}', { msg: x(e.message) })}</div>`;
    return;
  }

  // a vaccination = house + hatch + date + vaccine (customer lines of the same one count once)
  const vkey = v => [v.anath, v.hm_ekk, v.hm_emv, v.emvolio].join('|');
  const weekEnd = isoOf(addDays(today, 6));
  const week = new Map();
  vacc.filter(v => v.hm_emv <= weekEnd).forEach(v => {
    const k = vkey(v), w = week.get(k) || { notOrdered: false, notArrived: false };
    if (v.paragelia !== 'ΝΑΙ') w.notOrdered = true;
    else if (v.psygeio !== 'ΝΑΙ') w.notArrived = true;
    week.set(k, w);
  });
  const notOrdered = [...week.values()].filter(w => w.notOrdered).length;
  const notArrived = [...week.values()].filter(w => !w.notOrdered && w.notArrived).length;

  // links open the tool on what was clicked (focusFromLink there scrolls to it and makes it glow)
  const enc = encodeURIComponent;
  const vaccHref = (h, hatch, date) => `vaccine_tracker.html?house=${enc(h)}&hatch=${hatch}` + (date ? `&date=${date}` : '');
  const feedHref = h => `feed_tracker.html?house=${enc(h)}`;
  const hatchHref = p => p ? `schedule_checker.html?card=${p.id}` : 'schedule_checker.html';

  let firstFeed = null;
  const tiles = HOUSES.map(h => {
    const ps = placements.filter(p => p.house === h);
    const cur = ps.filter(p => p.doc_date <= todayIso).at(-1);
    const age = cur ? daysBetween(parseISO(cur.doc_date), today) : null;
    const next = ps.find(p => p.doc_date > todayIso);
    const nextDate = next && parseISO(next.doc_date);

    if (!cur || age >= emptyDay(cur)) {   // no flock in the house now
      const n = next && daysBetween(today, nextDate);
      const what = next ? t(n === 1 ? 'εκκόλαψη σε {n} ημέρα' : 'εκκόλαψη σε {n} ημέρες', { n }) : t('καμία προγραμματισμένη');
      return `<div class="tile empty"><div class="t-top"><div class="ring" style="background:var(--gh-canvas-subtle)"><span>—</span></div>` +
        `<div><div class="t-house">${h}</div><div class="t-sub">${t('Άδειο')}</div></div></div>` +
        line('egg', hatchHref(next), nextDate, what, today) + '</div>';
    }

    const pct = Math.min(100, Math.round(age / emptyDay(cur) * 100));
    // next vaccination of this flock: all vaccines of its first upcoming date
    const mine = vacc.filter(v => v.anath === h && v.hm_ekk === cur.doc_date);
    const vDate = mine.length ? mine[0].hm_emv : null;
    const vNames = [...new Set(mine.filter(v => v.hm_emv === vDate).map(v => (v.emvolio || '').replace(/ \/ /g, ` ${t('ή')} `)))].join(', ');
    // none for this flock, but some under a hatch date the scheduler doesn't know for this house
    // (e.g. the real hatch day, when the plan still has the ordered one) — flag it instead of "none"
    const stray = !vDate && vacc.find(v => v.anath === h && !ps.some(p => p.doc_date === v.hm_ekk));
    const vaccLine = stray
      ? line('vaccine', vaccHref(h, stray.hm_ekk), null, t('Εμβόλια: άλλη εκκόλαψη ({d})', { d: ddmm(parseISO(stray.hm_ekk)) }), today, 'warn')
      : line('vaccine', vDate ? vaccHref(h, cur.doc_date, vDate) : 'vaccine_tracker.html', vDate && parseISO(vDate), vDate ? x(vNames) : t('κανένας καταχωρημένος'), today);
    // next feed change, only when the feed tracker has this very flock
    const fr = feed.find(f => f.house === h);
    let feedLine;
    if (!fr || fr.hatch !== cur.doc_date) {
      feedLine = line('grain', feedHref(h), null, !fr ? t('λείπει από Ζωοτροφές') : t('Ζωοτροφές: άλλη εκκόλαψη'), today, 'warn');
    } else {
      const nf = nextFeed(fr, today);
      if (nf && (!firstFeed || nf.date < firstFeed.date)) firstFeed = { ...nf, house: h };
      feedLine = line('grain', feedHref(h), nf && nf.date, nf ? x(nf.name) : t('καμία άλλη αλλαγή'), today);
    }
    const [stText, stCls] = next ? (STATUS[next.status] ? [t(STATUS[next.status][0]), STATUS[next.status][1]] : [x(next.status), '']) : [t('καμία προγραμματισμένη'), ''];

    return `<div class="tile"><div class="t-top">` +
      `<div class="ring" style="background:conic-gradient(var(--gh-success-fg) ${pct}%,var(--gh-border-default) 0)"><span>${age}</span></div>` +
      `<div><div class="t-house">${h}</div><div class="t-sub">${t('{breed} · ημέρα {n}', { breed: x(cur.breed || '—'), n: age })}</div></div></div>` +
      vaccLine +
      feedLine +
      line('egg', hatchHref(next), nextDate, stText, today, stCls) +
      '</div>';
  });

  document.getElementById('tiles').innerHTML = tiles.join('');
  document.getElementById('pills').innerHTML =
    `<a class="pill" href="${week.size ? `vaccine_tracker.html?from=${todayIso}&to=${weekEnd}` : 'vaccine_tracker.html'}">${t(week.size === 1 ? '{n} εμβολιασμός τις επόμενες 7 ημέρες' : '{n} εμβολιασμοί τις επόμενες 7 ημέρες', { n: `<b>${week.size}</b>` })}` +
      (notOrdered ? ` · <span class="warn">${t('{n} χωρίς παραγγελία', { n: notOrdered })}</span>` : '') +
      (notArrived ? ` · ${t(notArrived === 1 ? '{n} δεν έχει έρθει' : '{n} δεν έχουν έρθει', { n: notArrived })}` : '') + '</a>' +
    (firstFeed ? `<a class="pill" href="${feedHref(firstFeed.house)}">${t('Επόμενο σιτηρέσιο: {what}, {when}', { what: `<b>${firstFeed.house} → ${x(firstFeed.name)}</b>`, when: when(firstFeed.date, today) })}</a>` : '');
}
// a tab left open overnight would keep yesterday's "today" — refresh when it's shown again
document.addEventListener('visibilitychange', () => { if (!document.hidden && _authSession) loadDashboard(); });
startPage({ onSignedIn: () => showDashboard(), onSignedOut: () => hideDashboard(), translated: true });
</script>
</body>
</html>
